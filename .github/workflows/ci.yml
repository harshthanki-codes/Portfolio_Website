name: CI Pipeline & Quality Verification

on:
  push:
    branches: [main, redesign-ink-coral]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://harshthanki-codes.github.io/Portfolio_Website
